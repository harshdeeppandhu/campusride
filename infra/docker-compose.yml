services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: campusride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusride
      POSTGRES_PASSWORD: campusride_dev_password
      POSTGRES_DB: campusride
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusride -d campusride"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
